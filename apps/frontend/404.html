<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Get the full path that the user tried to access.
        const path = window.location.pathname;

        if (/\/docs(?:\/|$)/.test(path)) {
            // The mkdocs site lives under /docs. If /docs (or one of its pages)
            // 404s, send the user to the docs home rather than bouncing the path
            // into the SPA, which has no /docs route. The match allows a missing
            // trailing slash so /mirumoji/docs is handled too.
            window.location.href = "/mirumoji/docs/";
        } else {
            // Store the intended path so the app can restore it after the
            // redirect to the base URL.
            sessionStorage.setItem('redirectPath', path);
            window.location.href = "/mirumoji/";
        }
    </script>
</head>

<body>
    <p>If you are not redirected automatically, follow this <a id="redirect-link" href="/mirumoji/">link to the home page</a>.
    </p>
    <script>
        document.getElementById('redirect-link').href = "/mirumoji/";
    </script>
</body>

</html>
