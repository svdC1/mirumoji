# Redirect to HTTPS
server {
    listen 80;
    server_name _;

    # Permanent Redirect
    return 308 https://$host$request_uri;
}


server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 2G; # Allow uploads up to 2G
    # SSL Config

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for API calls
    location /api/ {
        proxy_read_timeout 600s; # wait up to 10 min
        proxy_send_timeout 600s;
        # Buffer uploads so that nginx accepts them at full speed without throttling
        # on large files. The endpoints need the whole file before working, so buffering
        # adds no latency (adds just a temp file, capped by client_max_body_size)
        proxy_request_buffering on;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the openapi shcema to FastAPI SwaggerUI
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}