[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirumoji"
version = "3.0.0"
authors = [{ name = "svdc", email = "svdc1mail@gmail.com" }]
maintainers = [{ name = "svdc", email = "svdc1mail@gmail.com" }]
description = "Self-hostable Japanese language immersion tool"
keywords = [
    "japanese",
    "video-player",
    "language",
    "cli",
    "gui",
    "language-learning",
    "immersion",
    "anki",
    "whisper",
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

# Base Install - CLI + Launcher Only (Lightweight, No Heavy ML Deps)
dependencies = [
    "click",
    "python-dotenv"
]

[project.optional-dependencies]
# Core Server Stack - CPU
# API Deps
# Tokenizer
# Dictionary
# Media
# DB 
# Modal Offload

# LLM Provider - OpenAI SDK - `base_url` Supports
# Gemini (OpenAI-Compatible Endpoint)
# Any Local OpenAI-Compatible LLM Server
# Modal-Hosted OpenAI-Compatible LLM Server

# LLM Provider - Native Anthropic SDK For Better Claude Support

server = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "fugashi[unidic]==1.4.0",
    "kotobase==0.2.7",
    "pydantic==2.11.4",
    "pydantic[email]",
    "srt==3.5.3",
    "python-multipart==0.0.20",
    "aiofiles==24.1.0",
    "modal==1.1.3",
    "genanki==0.13.1",
    "databases==0.9.0",
    "aiosqlite==0.20.0",
    "platformdirs",
    "openai==1.76.2",
    "anthropic"

]

# Local Whisper Transcription (Modal Offload Deployments Don't Need This)
whisper-local = [
    "faster-whisper==1.1.1"
]


# Desktop GUI Launcher
gui = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "flaskwebgui",
    "python-socketio"
]

# Development Tools
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pip-tools"
]

[project.scripts]
mirumoji = "mirumoji.cli.launcher:cli"
mirumoji-gui = "mirumoji.cli.gui_launcher:main"
mirumoji-server = "mirumoji.server.app:run"

[project.urls]
Repository = "https://github.com/svdC1/mirumoji"
Issues = "https://github.com/svdC1/mirumoji/issues"
Documentation = "svdc1.github.io/mirumoji/docs"
Changelog = "svdc1.github.io/mirumoji/docs/changelog"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff ---
[tool.ruff]
target-version = "py310"
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI routers instantiate services at module level (cleanup planned for 3.x)
"src/mirumoji/server/routers/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- MyPy ---
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Tightening is planned for 3.x

# --- PyTest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
