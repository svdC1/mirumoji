[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirumoji"
version = "3.0.0"
authors = [{ name = "svdc", email = "svdc1mail@gmail.com" }]
maintainers = [{ name = "svdc", email = "svdc1mail@gmail.com" }]
description = "Self-Hostable Japanese Language Immersion Tool"
keywords = [
    "japanese",
    "video-player",
    "language",
    "cli",
    "gui",
    "language-learning",
    "immersion",
    "anki",
    "whisper",
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Education"
]
license = "MIT"
license-files = ["LICENSE*", "LICENCE*"]

# --- Dependencies ---

# Base Install - CLI Only
dependencies = [
    "typer",
    "rich",
    "python-dotenv",
    "platformdirs",
    "pyyaml"
]

[project.optional-dependencies]

# Core Server Stack - CPU Only
server = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "fugashi[unidic]==1.4.0",
    "kotobase==0.2.7",
    "pydantic==2.11.4",
    "pydantic[email]",
    "srt==3.5.3",
    "python-multipart==0.0.20",
    "aiofiles==24.1.0",
    "tqdm",
    "modal==1.1.3",
    "genanki==0.13.1",
    "aiosqlite==0.20.0",
    "openai==1.76.2",
    "anthropic"
]

# GPU Server Deployment (Local Transcription)
whisper-local = [
    "faster-whisper==1.1.1",
    "huggingface_hub",
    "sentencepiece",
    "requests"
]


# GUI Launcher Build
gui = [
    "flet[all]"
]

# Development Tools
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pip-tools"
]

[project.scripts]
mirumoji = "mirumoji.cli.main:app"

[project.urls]
Repository = "https://github.com/svdC1/mirumoji"
Issues = "https://github.com/svdC1/mirumoji/issues"
Documentation = "svdc1.github.io/mirumoji/docs"
Changelog = "svdc1.github.io/mirumoji/docs/changelog"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# --- Docker Data ---
[tool.setuptools.package-data]
mirumoji = ["docker/*", "docker/compose/*"]

# --- Ruff ---
[tool.ruff]
target-version = "py310"
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# FastAPI routers instantiate services at module level (cleanup planned for 3.x)
"src/mirumoji/server/routers/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- MyPy ---
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Minimal Local Stubs For Untyped Third-Party Libs
# Covers Only The Surface Used By Mirumoji
mypy_path = "stubs"

# --- PyTest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --- Flet (GUI) ---
[tool.flet]
desktop_flavor = "light"
