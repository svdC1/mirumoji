<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirumoji Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #logs::-webkit-scrollbar {
            width: 8px;
        }

        #logs::-webkit-scrollbar-track {
            background: #111827;
        }

        #logs::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 4px;
        }

        #logs::-webkit-scrollbar-thumb:hover {
            background-color: #6b7280;
        }

        .cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            from,
            to {
                color: transparent
            }

            50% {
                color: #a5b4fc;
            }
        }

        input,
        select {
            text-align: left;
        }
    </style>
</head>

<body class="bg-gray-200 dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased text-center">
    <div class="container mx-auto p-4 max-w-5xl">
        <header class="mb-4">
            <h1 class="text-4xl font-bold">Mirumoji Launcher</h1>
        </header>

        <nav class="bg-white dark:bg-gray-800 rounded-lg shadow-md mb-6">
            <div class="flex justify-center border-b border-gray-300 dark:border-gray-700">
                <button id="nav-launcher"
                    class="nav-link text-lg font-semibold py-3 px-6 -mb-px focus:outline-none">Launcher</button>
                <button id="nav-config"
                    class="nav-link text-lg font-semibold py-3 px-6 -mb-px focus:outline-none">Configuration</button>
            </div>
        </nav>

        <main>
            <div id="launcher-section">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                        <h2 class="text-2xl font-bold mb-4">Controls</h2>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <button id="start-btn"
                                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-transform transform hover:scale-105">Start
                                App</button>
                            <button id="stop-btn"
                                class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-transform transform hover:scale-105">Stop
                                App</button>
                        </div>
                        <button id="build-btn"
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-transform transform hover:scale-105">Build
                            Locally</button>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                        <div class="flex justify-center items-center mb-4">
                            <h2 class="text-2xl font-bold">System Info</h2>
                            <button id="refresh-btn"
                                class="ml-4 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-sm font-bold py-1 px-3 rounded-lg shadow transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 dark:focus:ring-offset-gray-800">Refresh</button>
                        </div>
                        <div id="system-info" class="space-y-4 text-gray-700 dark:text-gray-300">
                            <p>Loading...</p>
                        </div>
                        <hr class="my-4 border-gray-300 dark:border-gray-700">
                        <h3 class="text-xl font-bold mb-2">Status</h3>
                        <p id="status-text" class="text-lg font-semibold text-gray-700 dark:text-gray-300">Idle</p>
                    </div>
                </div>
            </div>

            <div id="config-section" class="hidden">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-bold mb-6">Application Settings</h2>
                    <div class="space-y-6 max-w-md mx-auto">
                        <div class="flex items-center justify-center pt-2">
                            <input id="local-build-checkbox" type="checkbox"
                                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="local-build-checkbox"
                                class="ml-3 block text-sm font-semibold text-gray-900 dark:text-gray-100">Use Local
                                Images</label>
                        </div>
                        <div class="flex items-center justify-center pt-2">
                            <input id="clean-stop-checkbox" type="checkbox" checked
                                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="clean-stop-checkbox"
                                class="ml-3 block text-sm font-semibold text-gray-900 dark:text-gray-100">Clean Stop
                                (Removes Volumes)</label>
                        </div>
                        <div>
                            <label for="repository-select"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Image
                                Repository</label>
                            <select id="repository-select"
                                class="mt-1 block w-full bg-gray-200 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                                <option>GitHub</option>
                                <option>DockerHub</option>
                            </select>
                        </div>
                        <div>
                            <label for="openai-key"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OpenAI API
                                Key</label>
                            <input type="password" id="openai-key"
                                class="mt-1 block w-full bg-gray-200 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                                placeholder="sk-...">
                        </div>
                        <div>
                            <label for="modal-id"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Modal Token ID
                                (CPU Only)</label>
                            <input type="password" id="modal-id"
                                class="mt-1 block w-full bg-gray-200 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                                placeholder="tok_...">
                        </div>
                        <div>
                            <label for="modal-secret"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Modal Token
                                Secret (CPU Only)</label>
                            <input type="password" id="modal-secret"
                                class="mt-1 block w-full bg-gray-200 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                                placeholder="ts-...">
                        </div>
                        <div id="gpu-option" class="flex items-center justify-center pt-2">
                            <input id="gpu-checkbox" type="checkbox"
                                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="gpu-checkbox"
                                class="ml-3 block text-sm font-semibold text-gray-900 dark:text-gray-100">Use NVIDIA GPU
                                </glabel>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-6">
            <div class="bg-gray-900 dark:bg-black rounded-lg shadow-2xl overflow-hidden">
                <div class="bg-gray-700 dark:bg-gray-800 p-2 border-b border-gray-600 dark:border-gray-700">
                    <span class="text-sm font-semibold text-gray-300">LOGS</span>
                </div>
                <div id="logs" class="h-80 p-4 font-mono text-sm text-left text-gray-300 overflow-y-auto">
                    <span class="text-gray-400">Awaiting output...</span><span class="cursor"></span>
                </div>
            </div>
        </footer>
    </div>
    <script src="/main.js"></script>
</body>

</html>
