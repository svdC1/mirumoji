name: Build and Push DevContainer GPU Docker Image

# Controls when the workflow will run
on:
    # Run manually
    workflow_dispatch:

jobs:
    # This job builds the docker image and pushes it to a registry
    build-and-push:
        runs-on: ubuntu-latest

        # Grant GITHUB_TOKEN permissions to write packages
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Set up Docker Buildx for multi-platform builds
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Login to Docker Hub
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            # Extract metadata (tags, labels) for Docker
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  # Define the image name structure.
                  images: docker.io/${{secrets.DOCKER_USERNAME}}/mirumoji_dev
                  tags: |
                      # rolling-tag
                      type=raw,value=gpu-latest

            - name: Clean up disk space before build
              run: |
                  docker system prune -af || true
                  sudo rm -rf /usr/share/dotnet || true
                  sudo rm -rf /usr/local/lib/android || true
                  sudo rm -rf /opt/ghc || true
                  sudo rm -rf /tmp/* || true
                  sudo apt-get clean

            # Build and push the Docker image
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: . # Build context is the repo root
                  file: ./.devcontainer/build/Dockerfile.gpu # Path to the Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }} # Use tags generated in the previous step
                  labels: ${{ steps.meta.outputs.labels }} # Use labels generated in the previous step
