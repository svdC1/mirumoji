name: Build Desktop App

# Reusable Workflow that Builds the Flet Desktop GUI Per OS via
# scripts/build_gui.py, Zips the Output Folder, and Attaches It to the Release.
#
# One `mirumoji-<version>-<os>.zip` per OS,
# each containing the platform bundle from apps/mirumoji/build/<platform>/

on:
    workflow_call:
        inputs:
            version:
                description: "Version Used In The Asset File Name"
                required: true
                type: string

permissions:
    # Required To Create The Release And Upload Assets
    contents: write

jobs:
    build:
        name: Build ${{ matrix.os_name }} Bundle
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                      os_name: linux
                    - os: windows-latest
                      platform: windows
                      os_name: windows
                    - os: macos-latest
                      platform: macos
                      os_name: macos
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set Up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Set Up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable

            - name: Install Linux Build Dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

            - name: Install GUI Bundle Tooling
              run: pip install -e "apps/mirumoji[gui]"

            - name: Build Desktop Bundle
              run: python scripts/build_gui.py ${{ matrix.platform }}

            - name: Zip Bundle
              run: python -c "import shutil; shutil.make_archive('mirumoji-${{ inputs.version }}-${{ matrix.os_name }}', 'zip', 'apps/mirumoji/build/${{ matrix.platform }}')"

            - name: Attach To Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  files: mirumoji-${{ inputs.version }}-${{ matrix.os_name }}.zip
