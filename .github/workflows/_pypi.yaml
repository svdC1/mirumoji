name: Publish To PyPI

# Reusable Workflow that Builds the mirumoji sdist + wheel and Publishes Them
# to PyPI via Trusted Publishing (OIDC, no stored token)

on:
    workflow_call:

jobs:
    build:
        name: Build Distribution
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set Up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Build Tooling
              run: pip install build

            - name: Build sdist + wheel
              run: cd apps/mirumoji && python -m build

            - name: Upload Distribution Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  # `python -m build` writes to <project>/dist
                  path: apps/mirumoji/dist/

    publish:
        name: Upload To PyPI
        runs-on: ubuntu-latest
        needs: build
        environment: pypi
        permissions:
            # Required For Trusted Publishing
            id-token: write
        steps:
            - name: Download Distribution Artifact
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Publish To PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist
