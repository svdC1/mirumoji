name: Deploy Pages

# Reusable Workflow that Builds the Frontend SPA + the MkDocs Site (including
# the TypeDoc-generated Frontend API markdown) and Deploys the Combined Site
# to GitHub Pages. The Frontend Lives at the Root, Docs Under /docs/

on:
    workflow_call:
    # Allow a standalone redeploy of the frontend + docs site from a branch,
    # without re-running the PyPI / image / desktop release jobs
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy:
        name: Build And Deploy
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --- Frontend Build ---
            - name: Set Up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install Frontend Dependencies
              run: cd apps/frontend && npm ci

            - name: Build Frontend For GitHub Pages
              run: cd apps/frontend && npm run build -- --base=/${{ github.event.repository.name }}/

            - name: Copy 404.html To dist
              run: cp apps/frontend/404.html apps/frontend/dist/404.html

            # --- Docs Build ---
            - name: Set Up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install MkDocs Dependencies
              run: cd apps/mirumoji && pip install .[dev]

            - name: Generate Frontend API Docs (TypeDoc)
              run: cd apps/frontend && npm run docs:generate

            - name: Build MkDocs Site
              run: cd docs/site && mkdocs build

            # --- Combine And Deploy ---
            - name: Assemble Combined Site
              run: |
                  mkdir -p _site/docs
                  cp -r apps/frontend/dist/* _site/
                  cp -r docs/site/site_html/* _site/docs/

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "./_site"

            - name: Deploy To GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
