name: Package GUI and Attach to GitHub Release

on:
    release:
        types: [published]

jobs:
    build_gui_executables:
        name: Build GUI on ${{ matrix.os_name }}
        runs-on: ${{ matrix.os_image }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os_image: ubuntu-latest
                      os_name: Linux
                      asset_name_suffix: linux
                      executable_name_base: mirumoji-gui
                    - os_image: macos-latest
                      os_name: macOS
                      asset_name_suffix: macos
                      executable_name_base: mirumoji-gui
                    - os_image: windows-latest
                      os_name: Windows
                      asset_name_suffix: windows
                      executable_name_base: mirumoji-gui
        env:
            PYTHON_VERSION: "3.11"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Editable Package
              run: pip install -e apps/cli/mirumoji

            - name: Install Pyinstaller
              run: pip install pyinstaller

            - name: Build executable for Windows
              if: matrix.os_name == 'Windows'
              run: |
                  pyinstaller --name ${{ matrix.executable_name_base }} --windowed --clean --collect-all apps/cli/mirumoji/src/mirumoji/ --add-data "apps/cli/mirumoji/src/mirumoji/gui/web;gui/web" --hidden-import "uvicorn.lifespan.on" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "websockets" --hidden-import "h11" --hidden-import "watchfiles" --hidden-import "click" apps/cli/mirumoji/src/mirumoji/gui/main.py

            - name: Build executable for Linux/macOS
              if: matrix.os_name != 'Windows'
              run: |
                  pyinstaller --name ${{ matrix.executable_name_base }} --clean --collect-all apps/cli/mirumoji/src/mirumoji/ --add-data "apps/cli/mirumoji/src/mirumoji/gui/web:gui/web" --hidden-import "uvicorn.lifespan.on" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "websockets" --hidden-import "h11" --hidden-import "watchfiles" --hidden-import "click" apps/cli/mirumoji/src/mirumoji/gui/main.py

            - name: List dist directory contents
              if: always()
              run: ls -R ./dist/

            - name: Archive executable for Windows
              if: matrix.os_name == 'Windows'
              run: |
                  Compress-Archive -Path dist/${{ matrix.executable_name_base }}/* -DestinationPath ${{ matrix.executable_name_base }}-${{ matrix.asset_name_suffix }}.zip

            - name: Archive executable for Linux/macOS
              if: matrix.os_name != 'Windows'
              run: |
                  zip -r ${{ matrix.executable_name_base }}-${{ matrix.asset_name_suffix }}.zip dist/${{ matrix.executable_name_base }}

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.executable_name_base }}-${{ matrix.asset_name_suffix }}
                  path: ${{ matrix.executable_name_base }}-${{ matrix.asset_name_suffix }}.zip
                  if-no-files-found: error

    upload_assets:
        name: Upload GUI Assets to Release
        needs: build_gui_executables
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: List downloaded artifacts
              run: ls -R artifacts

            - name: Upload Windows Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: ./artifacts/mirumoji-gui-windows/mirumoji-gui-windows.zip
                  asset_name: mirumoji-gui-windows.zip
                  asset_content_type: application/zip

            - name: Upload Linux Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: ./artifacts/mirumoji-gui-linux/mirumoji-gui-linux.zip
                  asset_name: mirumoji-gui-linux.zip
                  asset_content_type: application/zip

            - name: Upload macOS Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: ./artifacts/mirumoji-gui-macos/mirumoji-gui-macos.zip
                  asset_name: mirumoji-gui-macos.zip
                  asset_content_type: application/zip
