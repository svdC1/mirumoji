name: Package GUI and Attach to GitHub Release

on:
    release:
        types: [published]

jobs:
    build_gui_executables:
        name: Build GUI on ${{ matrix.os_name }}
        runs-on: ${{ matrix.os_image }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os_image: ubuntu-latest
                      os_name: Linux
                      asset_name_suffix: linux
                      executable_name_base: mirumoji-gui
                      final_executable_name: mirumoji-gui
                    - os_image: macos-latest
                      os_name: macOS
                      asset_name_suffix: macos
                      executable_name_base: mirumoji-gui
                      final_executable_name: mirumoji-gui
                    - os_image: windows-latest
                      os_name: Windows
                      asset_name_suffix: windows
                      executable_name_base: mirumoji-gui
                      final_executable_name: mirumoji-gui.exe
        env:
            PYTHON_VERSION: "3.11"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Editable Package
              run: pip install -e apps/cli/mirumoji

            - name: Build executable for Windows
              if: matrix.os_name == 'Windows'
              run: |
                  pyinstaller --name ${{ matrix.executable_name_base }} --onefile --windowed --clean --collect-all apps/cli/mirumoji/src/mirumoji/ --add-data "apps/cli/mirumoji/src/mirumoji/gui/web;gui/web" apps/cli/mirumoji/src/mirumoji/gui/main.py

            - name: Build executable for Linux/macOS
              if: matrix.os_name != 'Windows'
              run: |
                  pyinstaller --name ${{ matrix.executable_name_base }} --onefile --clean --collect-all apps/cli/mirumoji/src/mirumoji/ --add-data "apps/cli/mirumoji/src/mirumoji/gui/web:gui/web" apps/cli/mirumoji/src/mirumoji/gui/main.py

            - name: List dist directory contents
              if: always()
              run: ls -R ./dist/

            - name: Archive executable
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.executable_name_base }}-${{ matrix.asset_name_suffix }}
                  path: dist/${{ matrix.final_executable_name }}
                  if-no-files-found: error

    upload_assets:
        name: Upload GUI Assets to Release
        needs: build_gui_executables
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: List downloaded artifacts
              run: ls -R artifacts

            - name: Upload Windows Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: ./artifacts/mirumoji-gui-windows/mirumoji-gui.exe
                  asset_name: mirumoji-gui-windows.exe
                  asset_content_type: application/vnd.microsoft.portable-executable

            - name: Upload Linux Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: ./artifacts/mirumoji-gui-linux/mirumoji-gui
                  asset_name: mirumoji-gui-linux
                  asset_content_type: application/octet-stream

            - name: Upload macOS Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: ./artifacts/mirumoji-gui-macos/mirumoji-gui
                  asset_name: mirumoji-gui-macos
                  asset_content_type: application/octet-stream
