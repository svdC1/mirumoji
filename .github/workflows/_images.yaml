name: Build And Push Images

# Reusable workflow that builds every distributable Docker image in one matrix
# and pushes to Docker Hub. The backend (cpu/gpu) and frontend share the `mirumoji`
# repo with a tag prefix. The Modal image lives in its own `mirumoji-modal-gpu`
# repo. Versions come from `_version.yaml` workflow

on:
    workflow_call:
        inputs:
            version:
                description: "Version Used For Immutable Image Tag"
                required: true
                type: string
        secrets:
            DOCKER_USERNAME:
                required: true
            DOCKER_TOKEN:
                required: true

jobs:
    build:
        name: Build ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: backend-cpu
                      context: ./apps/mirumoji
                      file: ./apps/mirumoji/src/mirumoji/docker/Dockerfile.cpu
                      image_suffix: mirumoji
                      tag_prefix: backend-cpu-
                      cache: false
                    - name: backend-gpu
                      context: ./apps/mirumoji
                      file: ./apps/mirumoji/src/mirumoji/docker/Dockerfile.gpu
                      image_suffix: mirumoji
                      tag_prefix: backend-gpu-
                      cache: false
                    - name: backend-modal
                      context: ./apps/mirumoji
                      file: ./apps/mirumoji/src/mirumoji/docker/Dockerfile.modal
                      image_suffix: mirumoji-modal-gpu
                      tag_prefix: ""
                      cache: false
                    - name: frontend
                      context: ./apps/frontend
                      file: ./apps/frontend/Dockerfile
                      image_suffix: mirumoji
                      tag_prefix: frontend-
                      cache: true
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set Up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log In To Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Extract Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_suffix }}
                  tags: |
                      type=raw,value=${{ matrix.tag_prefix }}${{ inputs.version }}
                      type=raw,value=${{ matrix.tag_prefix }}latest

            - name: Free Up Disk Space
              run: |
                  docker system prune -af || true
                  sudo rm -rf /usr/share/dotnet || true
                  sudo rm -rf /usr/local/lib/android || true
                  sudo rm -rf /opt/ghc || true
                  sudo rm -rf /tmp/* || true
                  sudo apt-get clean

            - name: Build And Push ${{ matrix.name }}
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: ${{ matrix.cache && 'type=gha' || '' }}
                  cache-to: ${{ matrix.cache && 'type=gha,mode=max' || '' }}
