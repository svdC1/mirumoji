name: Deploy Frontend and Docs to GitHub Pages

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            # --- Frontend Build ---
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Frontend Dependencies
              run: cd ./apps/frontend && npm install

            - name: Build Frontend for GitHub Pages
              run: cd ./apps/frontend && npm run build -- --base=/${{ github.event.repository.name }}/

            - name: Copy 404.html to dist
              run: cp ./apps/frontend/404.html ./apps/frontend/dist/404.html

            # --- Docs Build ---
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: 3.11

            - name: Install MkDocs Dependencies
              run: cd ./docs/site && pip install -r requirements.txt

            - name: Generate TypeScript Docs
              run: cd ./apps/frontend && npm run docs:generate

            - name: Build MkDocs site
              run: cd ./docs/site && mkdocs build

            # --- Combine and Deploy ---
            - name: Prepare combined artifact
              run: |
                  mkdir -p _site/docs
                  cp -r ./apps/frontend/dist/* _site/
                  cp -r ./docs/site/site_html/* _site/docs/

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "./_site"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
