name: Quality Gates

on:
    push:
        branches: [main, v3-refactor]
    pull_request:
        branches: [main, v3-refactor]

jobs:
    # --- Python: Ruff + MyPy ---
    python-lint:
        name: Python lint (ruff + mypy)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install all extras + dev dependencies
              # Install every runtime extra so mypy type-checks against the real
              # (typed) optional deps - e.g. the openai / anthropic SDKs (in the
              # server core) ship py.typed - instead of treating them as Any.
              run: |
                  python -m pip install --upgrade pip
                  pip install -e "apps/mirumoji[server,whisper-local,dev]"

            - name: ruff check
              run: ruff check apps/mirumoji/src

            - name: ruff format check
              run: ruff format --check apps/mirumoji/src

            - name: mypy
              run: mypy apps/mirumoji/src

    # --- Python: pytest ---
    python-test:
        name: Python tests (pytest)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install server + dev dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e "apps/mirumoji[server,dev]"

            - name: Run pytest
              run: |
                  cd apps/mirumoji
                  pytest --tb=short -q

    # --- Frontend: eslint + prettier ---
    frontend-lint:
        name: Frontend lint (ESLint + Prettier)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install dependencies
              run: cd apps/frontend && npm ci

            - name: ESLint
              run: cd apps/frontend && npm run lint

            - name: Prettier check
              run: cd apps/frontend && npm run format:check

    # --- Frontend: vitest ---
    frontend-test:
        name: Frontend tests (Vitest)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install dependencies
              run: cd apps/frontend && npm ci

            - name: Run Vitest
              run: cd apps/frontend && npm test -- --run
