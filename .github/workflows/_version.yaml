name: Resolve Version

# Reusable Workflow that Reads the version from apps/mirumoji/pyproject.toml
# and asserts that the release tag matches it. Other release workflows consume
# the `version` output

on:
    workflow_call:
        outputs:
            version:
                description: "Package Version From pyproject.toml"
                value: ${{ jobs.resolve.outputs.version }}
            is_prerelease:
                description: "True When The Version Is A Pre-Release (rc/a/b/dev)"
                value: ${{ jobs.resolve.outputs.is_prerelease }}

jobs:
    resolve:
        name: Resolve And Verify Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.read.outputs.version }}
            is_prerelease: ${{ steps.read.outputs.is_prerelease }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Read Version From pyproject.toml
              id: read
              run: |
                  version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('apps/mirumoji/pyproject.toml').read_text())['project']['version'])")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "Resolved Version: $version"
                  # A final release is exactly MAJOR.MINOR.PATCH. Anything else
                  # (rc/a/b/dev/post suffixes) is a pre-release.
                  if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
                      echo "Pre-Release: false"
                  else
                      echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
                      echo "Pre-Release: true"
                  fi

            - name: Assert Tag Matches Version
              # Only Enforced For Tag-Triggered Runs (manual dispatch skips it)
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="${{ steps.read.outputs.version }}"
                  if [ "$tag" != "$pkg" ]; then
                      echo "::error::Tag ($GITHUB_REF_NAME -> $tag) does not match pyproject.toml version ($pkg)"
                      exit 1
                  fi
                  echo "Tag $GITHUB_REF_NAME matches version $pkg"
