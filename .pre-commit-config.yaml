# The demo commits machine-generated fixtures and a sample video under
# src/demo/generated. It is committed output (already prettier-ignored), so
# every hygiene hook skips it. The assets also exceed the large-file limit
# on purpose, and the generator writes JSON without a trailing newline
exclude: ^apps/frontend/src/demo/generated/

repos:
    # --- General File Hygiene ---
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-merge-conflict
          - id: check-yaml
          - id: check-added-large-files
            args: [--maxkb=1000]

    # --- Python: ruff (lint + format) ---
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.11.0
      hooks:
          - id: ruff
            args: [--fix]
            files: ^apps/mirumoji/src/
          - id: ruff-format
            files: ^apps/mirumoji/src/

    # --- Sync .github/ meta files to the per-app copies ---
    - repo: local
      hooks:
          - id: sync-meta
            name: Sync README + LICENSE From .github
            language: python
            entry: python scripts/sync_meta.py
            files: ^\.github/(README\.md|LICENSE)$
            pass_filenames: false

    # --- Frontend: eslint + prettier ---
    - repo: local
      hooks:
          - id: frontend-eslint
            name: Frontend ESLint
            language: node
            entry: bash -c 'cd apps/frontend && npm run lint'
            files: ^apps/frontend/src/.*\.(ts|tsx)$
            pass_filenames: false

          - id: frontend-prettier
            name: Frontend Prettier
            language: node
            entry: bash -c 'cd apps/frontend && npx prettier --check src'
            files: ^apps/frontend/src/.*\.(ts|tsx|css|json)$
            pass_filenames: false
