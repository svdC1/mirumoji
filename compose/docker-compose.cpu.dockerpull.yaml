services:
    frontend:
        image: svdc1/mirumoji:frontend-latest
        ports:
            - "80:80" # HTTP Nginx
            - "443:443" #HTTPS Nginx
        environment:
            - HOST_LAN_IP=${HOST_LAN_IP:?error}
        depends_on:
            - backend
        networks:
            - app-network

    backend:
        image: svdc1/mirumoji:backend-cpu-latest
        ports:
            - "8000:8000"
        environment:
            # This tells Docker Compose to get the value for OPENAI_API_KEY
            # from the .env file or from the shell environment if set there.
            - OPENAI_API_KEY=${OPENAI_API_KEY:?error}
            - MODAL_TOKEN_ID=${MODAL_TOKEN_ID:?error}
            - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET:?error}
            - MIRUMOJI_LOGGING_LEVEL=${MIRUMOJI_LOGGING_LEVEL:-INFO}
            - MIRUMOJI_MODAL_GPU=${MIRUMOJI_MODAL_GPU:-A10G})
            - MODAL_FORCE_BUILD=${MODAL_FORCE_BUILD:-0}
        volumes:
            - logs:/root/.mirumoji_logs
            - data:/app/data/
            - media_files:/app/media_files
        networks:
            - app-network

volumes:
    logs:
    data:
    media_files:
networks:
    app-network:
        driver: bridge
