services:
    frontend:
        image: svdc1/mirumoji:frontend-latest
        ports:
            - "80:80" # HTTP Nginx
            - "443:443" #HTTPS Nginx
        environment:
            - HOST_LAN_IP=${HOST_LAN_IP:?error}
        depends_on:
            - backend
        networks:
            - app-network

    backend:
        image: svdc1/mirumoji:backend-gpu-latest
        ports:
            - "8000:8000"
        environment:
            # This tells Docker Compose to get the value for OPENAI_API_KEY
            # from the .env file or from the shell environment if set there.
            - OPENAI_API_KEY=${OPENAI_API_KEY:?error}
            - MIRUMOJI_LOGGING_LEVEL=${MIRUMOJI_LOGGING_LEVEL:-INFO}
        volumes:
            - logs:/root/.mirumoji_logs
            - huggingface_cache:/root/.cache/huggingface
            - data:/app/data/
            - media_files:/app/media_files
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        networks:
            - app-network

volumes:
    logs:
    huggingface_cache:
    data:
    media_files:
networks:
    app-network:
        driver: bridge
